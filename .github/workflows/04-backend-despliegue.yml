name: Backend - Despliegue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pedidos360-backend-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Desplegar backend en ECS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar, probar y empaquetar backend
        working-directory: backend
        run: mvn -B clean verify

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Iniciar sesión en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --tag "$REGISTRY/$ECR_REPOSITORY:latest" \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA" \
            --file backend/Dockerfile \
            backend

      - name: Publicar imágenes en ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA"

      - name: Forzar nuevo deployment ECS
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          set -euo pipefail
          RESPONSE=$(aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --output json)

          SERVICE_STATUS=$(jq -r '.service.status // ""' <<< "$RESPONSE")
          DESIRED_COUNT=$(jq -r '.service.desiredCount // ""' <<< "$RESPONSE")
          RUNNING_COUNT=$(jq -r '.service.runningCount // ""' <<< "$RESPONSE")
          PENDING_COUNT=$(jq -r '.service.pendingCount // ""' <<< "$RESPONSE")
          TASK_DEFINITION=$(jq -r '.service.taskDefinition // ""' <<< "$RESPONSE")
          PRIMARY_COUNT=$(jq '[.service.deployments[]? | select(.status == "PRIMARY")] | length' <<< "$RESPONSE")
          PRIMARY_ROLLOUT=$(jq -r '[.service.deployments[]? | select(.status == "PRIMARY") | .rolloutState][0] // ""' <<< "$RESPONSE")

          echo "Estado del servicio: $SERVICE_STATUS"
          echo "Desired: $DESIRED_COUNT"
          echo "Running: $RUNNING_COUNT"
          echo "Pending: $PENDING_COUNT"
          echo "Task definition: $TASK_DEFINITION"
          echo "Deployments PRIMARY: $PRIMARY_COUNT"
          echo "Rollout PRIMARY: $PRIMARY_ROLLOUT"

          if [[ "$SERVICE_STATUS" != "ACTIVE" ]]; then
            echo "ECS no aceptó un servicio ACTIVE"
            exit 1
          fi

          if [[ "$PRIMARY_COUNT" -lt 1 ]]; then
            echo "ECS no devolvió un deployment PRIMARY"
            exit 1
          fi

          if [[ "$PRIMARY_ROLLOUT" != "IN_PROGRESS" && "$PRIMARY_ROLLOUT" != "COMPLETED" ]]; then
            echo "Rollout PRIMARY inválido: $PRIMARY_ROLLOUT"
            exit 1
          fi

      - name: Mostrar resumen
        env:
          IMAGE_SHA: ${{ github.sha }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          echo "Imagen publicada en ECR correctamente: $IMAGE_SHA"
          echo "Deployment solicitado y aceptado por ECS."
          echo "SHA: $GITHUB_SHA"
          echo "Cluster: $ECS_CLUSTER"
          echo "Service: $ECS_SERVICE"
          echo "La verificación posterior de estabilidad mediante DescribeServices se omite porque AWS Academy aplica un explicit deny a ecs:DescribeServices."
