name: Backend - Compilación

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-backend:
    name: Compilar backend Spring Boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar, probar y empaquetar backend
        run: mvn -B clean verify

      - name: Verificar JAR generado
        run: test -n "$(find target -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Subir JAR del backend
        uses: actions/upload-artifact@v4
        with:
          name: pedidos360-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
