services:
  postgres:
    image: postgres:16
    container_name: pedidos360-postgres
    environment:
      POSTGRES_DB: pedidos360
      POSTGRES_USER: pedidos360
      # Solo para desarrollo local. No usar este valor en ambientes productivos.
      POSTGRES_PASSWORD: pedidos360
    ports:
      - "5432:5432"
    volumes:
      - pedidos360-postgres-data:/var/lib/postgresql/data

volumes:
  pedidos360-postgres-data:
